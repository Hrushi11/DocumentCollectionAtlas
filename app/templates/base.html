<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Document Collection{% endblock %}</title>
  <style>
    :root { --line:#e2e2e6; --muted:#6b7280; --bg:#f7f7f9; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
           margin: 0; color:#1f2430; background:var(--bg); }
    header { background:#1f2937; color:#fff; padding:14px 24px; }
    header a { color:#cbd5e1; text-decoration:none; }
    main { max-width: 1040px; margin: 24px auto; padding: 0 20px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    h2 { font-size: 16px; margin: 26px 0 10px; }
    .muted { color: var(--muted); font-size: 13px; }
    table { width:100%; border-collapse: collapse; background:#fff; border:1px solid var(--line);
            border-radius:8px; overflow:hidden; }
    th, td { text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); font-size:14px; }
    th { background:#fafafa; font-size:12px; text-transform:uppercase; letter-spacing:.03em; color:#4b5563; }
    tr:last-child td { border-bottom:none; }
    .cards { display:flex; gap:12px; flex-wrap:wrap; margin:14px 0; }
    .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:12px 16px; min-width:120px; }
    .card .n { font-size:24px; font-weight:600; }
    .card .l { font-size:12px; color:var(--muted); text-transform:uppercase; }
    .card.attn { border-color:#f59e0b; }
    .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; font-weight:600; }
    .b-received { background:#dcfce7; color:#166534; }
    .b-outstanding { background:#fef3c7; color:#92400e; }
    .b-not_needed { background:#e5e7eb; color:#374151; }
    .b-exception { background:#fee2e2; color:#991b1b; }
    .b-needs_review { background:#fef3c7; color:#92400e; }
    form.inline { display:inline; }
    button, input[type=submit] { font: inherit; padding:5px 10px; border:1px solid #cbd5e1; background:#fff;
             border-radius:6px; cursor:pointer; }
    button.primary { background:#2563eb; color:#fff; border-color:#2563eb; }
    button.link { border:none; background:none; color:#2563eb; padding:2px; }
    select, input[type=text], input[type=number] { font:inherit; padding:5px 8px; border:1px solid #cbd5e1; border-radius:6px; }
    .panel { background:#fff; border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:14px; }
    .attn-item { border-left:3px solid #f59e0b; }
  </style>
</head>
<body>
  <header><a href="{{ url_for('main.index') }}">← Document Collection</a></header>
  <main>{% block body %}{% endblock %}</main>
</body>
</html>
