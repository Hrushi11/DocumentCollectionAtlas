<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Document Collection{% endblock %}</title>
  <style>
    :root { --line:#e5e7eb; --muted:#6b7280; --bg:#f5f6f8; --blue:#2563eb; --ink:#111827; }
    * { box-sizing: border-box; }
    body { font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; margin:0;
           color:var(--ink); background:var(--bg); line-height:1.45; }
    header { background:#111827; color:#fff; padding:14px 24px; display:flex; align-items:center; gap:16px; }
    header a.home { color:#e5e7eb; text-decoration:none; font-weight:600; }
    main { max-width:1000px; margin:24px auto 60px; padding:0 20px; }
    h1 { font-size:24px; margin:0 0 4px; }
    h2 { font-size:16px; margin:28px 0 10px; }
    .muted { color:var(--muted); font-size:13px; }
    a { color:var(--blue); }

    table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line);
            border-radius:10px; overflow:hidden; }
    th,td { text-align:left; padding:10px 14px; border-bottom:1px solid var(--line); font-size:14px; vertical-align:top; }
    th { background:#fafafa; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:#6b7280; }
    tr:last-child td { border-bottom:none; }

    .tiles { display:flex; gap:12px; flex-wrap:wrap; margin:16px 0; }
    .tile { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 18px; min-width:130px; }
    .tile .n { font-size:28px; font-weight:700; line-height:1; }
    .tile .l { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin-top:6px; }
    .tile.attn { border-color:#f59e0b; background:#fffbeb; }
    .tile.attn .n { color:#b45309; }

    .badge { display:inline-block; padding:3px 9px; border-radius:999px; font-size:12px; font-weight:600; white-space:nowrap; }
    .b-received { background:#dcfce7; color:#166534; }
    .b-outstanding { background:#fef3c7; color:#92400e; }
    .b-not_needed { background:#e5e7eb; color:#374151; }
    .b-inactive { background:#f3f4f6; color:#9ca3af; }

    .panel { background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:14px; }
    .next { border-radius:10px; padding:12px 16px; margin:12px 0 4px; font-weight:600; }
    .next.info { background:#eff6ff; color:#1e40af; border:1px solid #bfdbfe; }
    .next.warn { background:#fffbeb; color:#92400e; border:1px solid #fde68a; }
    .next.done { background:#ecfdf5; color:#065f46; border:1px solid #a7f3d0; }

    details.help { background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 16px; margin-bottom:14px; }
    details.help summary { cursor:pointer; font-weight:600; }
    details.help ol { margin:10px 0 2px; padding-left:20px; color:#374151; font-size:14px; }

    .review { border-left:4px solid #f59e0b; }
    .review .why { color:#92400e; font-size:13px; margin:4px 0 10px; }
    .actions { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }

    form.inline { display:inline; }
    label.f { display:block; font-size:12px; color:#6b7280; margin:10px 0 4px; text-transform:uppercase; letter-spacing:.03em; }
    input[type=text],input[type=number],select { font:inherit; padding:7px 10px; border:1px solid #cbd5e1; border-radius:8px; }
    input[type=text],select { min-width:160px; }
    button, .btn { font:inherit; padding:8px 14px; border:1px solid #cbd5e1; background:#fff; border-radius:8px; cursor:pointer; text-decoration:none; color:var(--ink); display:inline-block; }
    button.primary, .btn.primary { background:var(--blue); color:#fff; border-color:var(--blue); }
    button.link { border:none; background:none; color:var(--blue); padding:2px 4px; }
    button.danger { color:#b91c1c; }
    .empty { text-align:center; padding:40px 20px; color:var(--muted); }
    .flash { border-radius:10px; padding:10px 14px; margin:0 0 10px; font-size:14px; font-weight:500; }
    .flash.ok { background:#ecfdf5; color:#065f46; border:1px solid #a7f3d0; }
    .flash.warn { background:#fffbeb; color:#92400e; border:1px solid #fde68a; }
    .flash.err { background:#fef2f2; color:#991b1b; border:1px solid #fecaca; }
    .row-people { display:grid; grid-template-columns:1.4fr 1fr .8fr; gap:10px; margin-bottom:8px; }
    .filed { color:#166534; }
  </style>
</head>
<body>
  <header>
    <a class="home" href="{{ url_for('main.index') }}">📄 Document Collection</a>
    <span class="muted" style="color:#9ca3af">Tax document checklist for your clients</span>
  </header>
  <main>
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}
    {% endwith %}
    {% block body %}{% endblock %}
  </main>
</body>
</html>
